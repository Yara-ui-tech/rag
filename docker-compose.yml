version: '3.8'

services:
  rag-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-training-studio
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:5050"
    volumes:
      # Persist knowledge base documents and vector database index across container restarts
      - ./data:/app/data
      - ./storage:/app/storage
    environment:
      - PORT=5050
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
